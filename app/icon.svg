<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 30" width="30" height="30">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="30" height="30" rx="7" fill="url(#g)"/>
  <g transform="scale(0.94) translate(1,1)">
  <!-- Center nucleus -->
  <circle cx="15" cy="16" r="2.8" fill="white"/>
  <!-- Orbit 1 (horizontal ellipse) -->
  <ellipse cx="15" cy="16" rx="10" ry="4" fill="none" stroke="white" stroke-width="1.8"/>
  <!-- Orbit 2 (tilted 60deg) -->
  <ellipse cx="15" cy="16" rx="10" ry="4" fill="none" stroke="white" stroke-width="1.8" transform="rotate(60 15 16)"/>
  <!-- Orbit 3 (tilted 120deg) -->
  <ellipse cx="15" cy="16" rx="10" ry="4" fill="none" stroke="white" stroke-width="1.8" transform="rotate(120 15 16)"/>
</g>
</svg>